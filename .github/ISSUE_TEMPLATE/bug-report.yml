name: Bug report
description: Report a reproducible problem in ThreadLine.
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues and the [troubleshooting guide](https://github.com/ChenMiaoi/threadline/blob/main/docs/troubleshooting.md) first.
        Remove tokens, private repository content, and personal information from shared logs or screenshots.
  - type: input
    id: version
    attributes:
      label: ThreadLine version
      description: Find the version in Settings → About and Updates. For a source build, include the commit.
      placeholder: v0.1.2, or commit hash
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: Windows 11 x64, or macOS 15 on Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How are you running ThreadLine?
      options:
        - Installed desktop release
        - Desktop built from source
        - Browser development preview
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the affected page and whether the problem survives a refresh or restart. A public repository or PR link can help when relevant.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any error text and how often this happens.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or additional context
      description: For layout problems, include the window size, theme, and relevant appearance settings. For browser previews, include the browser and version.
