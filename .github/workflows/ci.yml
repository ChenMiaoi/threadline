name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
      - id: scope
        run: node scripts/ci-changes.ts

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm test -- scripts/ci-changes.test.ts

  macos:
    name: macOS checks and installer
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.1'
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Build macOS test installer
        run: npm run build:desktop:installer

      - name: Verify installer output
        run: test -d src-tauri/target/debug/bundle/macos/ThreadLine.app && ls src-tauri/target/debug/bundle/dmg/*.dmg

      - name: Upload macOS test installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threadline-macos-debug-${{ github.sha }}
          path: |
            src-tauri/target/debug/bundle/dmg/*.dmg
            LICENSE
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows checks and installer
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.1'
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Build Windows test installer
        run: npm run build:desktop:installer

      - name: Verify installer output
        run: |
          if (-not (Test-Path 'src-tauri/target/debug/bundle/nsis/*-setup.exe')) {
            throw 'The Windows NSIS installer was not generated.'
          }

      - name: Upload Windows test installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threadline-windows-x64-debug-${{ github.sha }}
          path: |
            src-tauri/target/debug/bundle/nsis/*-setup.exe
            LICENSE
          if-no-files-found: error
          retention-days: 7

  result:
    name: CI result
    if: always()
    needs: [changes, docs, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        env:
          SCOPE: ${{ needs.changes.result }}
          DOCS: ${{ needs.docs.result }}
          FULL: ${{ needs.changes.outputs.full }}
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          test "$SCOPE" = success
          test "$DOCS" = success
          if [ "$FULL" = true ]; then
            test "$MACOS" = success
            test "$WINDOWS" = success
          else
            test "$MACOS" = skipped
            test "$WINDOWS" = skipped
          fi
