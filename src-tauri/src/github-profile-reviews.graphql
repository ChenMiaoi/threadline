query ProfileReviews(
  $query: String!
  $after: String
  $login: String!
  $owner: String!
  $name: String!
) {
  viewer {
    login
  }
  repository(owner: $owner, name: $name) {
    isFork
  }
  search(query: $query, type: ISSUE, first: 100, after: $after) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ... on PullRequest {
        number
        reviews(
          last: 100
          author: $login
          states: [COMMENTED, APPROVED, CHANGES_REQUESTED, DISMISSED]
        ) {
          pageInfo {
            hasPreviousPage
            startCursor
          }
          nodes {
            submittedAt
          }
        }
      }
    }
  }
}
