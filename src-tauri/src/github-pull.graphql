query PullOverview($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      number
      title
      body
      url
      state
      merged
      isDraft
      reviewDecision
      mergeStateStatus
      mergeable
      author {
        login
      }
      headRefOid
      headRefName
      baseRefName
      additions
      deletions
      changedFiles
      commits(last: 1) {
        totalCount
        nodes {
          commit {
            statusCheckRollup {
              state
            }
          }
        }
      }
    }
  }
}
