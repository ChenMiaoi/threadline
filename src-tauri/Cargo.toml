[package]
name = "threadline"
version = "0.1.4"
description = "ThreadLine desktop workspace"
license = "GPL-3.0-only"
edition = "2021"
default-run = "threadline"

[features]
browser-preview = []

[[bin]]
name = "github-preview"
path = "src/bin/github-preview.rs"
required-features = ["browser-preview"]

[lib]
name = "threadline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
zeroize = "1.8"
tempfile = "3"
dirs = "6"
fs2 = "0.4"
fontdb = "0.24"
tauri-plugin-notification = "2.8.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSError", "NSObject", "NSString", "NSUUID"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "0.6.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Media_Audio"] }
