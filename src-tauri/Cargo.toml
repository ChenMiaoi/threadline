[package]
name = "threadline"
version = "0.1.1"
description = "ThreadLine desktop workspace"
license = "GPL-3.0-only"
edition = "2021"
default-run = "threadline"

[features]
browser-preview = []

[[bin]]
name = "github-preview"
path = "src/bin/github-preview.rs"
required-features = ["browser-preview"]

[lib]
name = "threadline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
zeroize = "1.8"
tempfile = "3"
dirs = "6"
fs2 = "0.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
