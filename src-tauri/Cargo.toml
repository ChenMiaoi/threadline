[package]
name = "threadline"
version = "0.1.0"
description = "ThreadLine desktop workspace"
license = "GPL-3.0-only"
edition = "2021"
default-run = "threadline"

[features]
browser-preview = []

[[bin]]
name = "github-preview"
path = "src/bin/github-preview.rs"
required-features = ["browser-preview"]

[lib]
name = "threadline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }
